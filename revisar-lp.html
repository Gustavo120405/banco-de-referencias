<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revisar LP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#09090b;--bg2:#0f0f12;--bg3:#161619;--bg4:#1c1c20;--border:rgba(255,255,255,0.07);--border-act:rgba(255,255,255,0.18);--text:#ededed;--muted:#777;--dim:#444;--accent:#c8f564;--accent-dim:rgba(200,245,100,0.1);--red:#ff5c5c;--red-dim:rgba(255,92,92,0.1);--yellow:#ffd166;--yellow-dim:rgba(255,209,102,0.1);--green:#06d6a0;--green-dim:rgba(6,214,160,0.1)}
    html,body{height:100%;overflow:hidden}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
    .topbar{height:56px;flex-shrink:0;background:rgba(9,9,11,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:100}
    .topbar-logo{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:6px;flex-shrink:0}
    .logo-dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
    .topbar-sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
    .project-name{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .status-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:5px;flex-shrink:0}
    .status-badge.revisao{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(255,209,102,.25)}
    .status-badge.aprovada{background:var(--green-dim);color:var(--green);border:1px solid rgba(6,214,160,.25)}
    .topbar-actions{display:flex;gap:8px;margin-left:auto;flex-shrink:0}
    .btn-top{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;border-radius:7px;cursor:pointer;transition:all .15s;white-space:nowrap;border:1px solid var(--border);background:var(--bg3);color:var(--muted)}
    .btn-top:hover{border-color:var(--border-act);color:var(--text)}
    .btn-top.primary{background:var(--accent);color:#000;border-color:transparent;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
    .btn-top.primary:hover{background:#d4ff6e}
    .btn-top.danger{background:var(--red-dim);color:var(--red);border-color:rgba(255,92,92,.25)}
    .workspace{display:flex;flex:1;overflow:hidden}
    .preview-panel{flex:1;overflow:hidden;position:relative;background:#fff}
    .mode-toggle{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:30;display:flex;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:8px;overflow:hidden}
    .mode-btn{font-size:11px;font-weight:500;padding:6px 14px;cursor:pointer;transition:all .15s;color:var(--muted);background:transparent;border:none;letter-spacing:.04em}
    .mode-btn.active{background:var(--bg3);color:var(--text)}
    .feedback-mode-hint{position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(200,245,100,.12);border:1px solid rgba(200,245,100,.3);border-radius:8px;padding:8px 16px;font-size:12px;color:var(--accent);display:none;white-space:nowrap;pointer-events:none}
    .feedback-mode-hint.show{display:block}
    .iframe-wrap{width:100%;height:100%;position:relative}
    .iframe-wrap iframe{width:100%;height:100%;border:none;display:block}
    .overlay-canvas{position:absolute;inset:0;z-index:20;cursor:crosshair;display:none;background:rgba(200,245,100,.03)}
    .overlay-canvas.active{display:block}
    .section-highlight{position:absolute;border:2px solid transparent;border-radius:4px;transition:all .15s;cursor:pointer}
    .section-highlight:hover{border-color:var(--accent);background:rgba(200,245,100,.06)}
    .section-highlight.has-feedback{border-color:var(--yellow);background:rgba(255,209,102,.04)}
    .section-label { position: absolute; top: 8px; left: 8px;font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--accent);color:#000;padding:3px 8px;border-radius:4px;white-space:nowrap;font-weight:600;opacity:0;transition:opacity .15s;pointer-events:none}
    .section-highlight:hover .section-label{opacity:1}
    .lp-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);z-index:50}
    .lp-loading.hidden{display:none}
    .lp-spinner{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite}
    .lp-txt{font-size:14px;color:var(--muted)}
    .lp-sub{font-size:12px;color:var(--dim);text-align:center;max-width:320px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .fb-popup{position:absolute;z-index:40;width:300px;background:var(--bg3);border:1px solid rgba(200,245,100,.3);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.6);overflow:hidden;display:none}
    .fb-popup.show{display:block}
    .fb-popup-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
    .fb-popup-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--accent);flex:1}
    .fb-popup-close{width:22px;height:22px;border-radius:5px;background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
    .fb-popup-close:hover{background:var(--bg4);color:var(--text)}
    .fb-popup-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
    .fb-popup select,.fb-popup textarea{font-family:'Inter',sans-serif;font-size:12px;color:var(--text);background:var(--bg4);border:1px solid var(--border);border-radius:7px;padding:8px 12px;outline:none;width:100%;-webkit-appearance:none}
    .fb-popup select option{background:#1c1c20}
    .fb-popup textarea{resize:none;line-height:1.6}
    .fb-popup textarea:focus{border-color:rgba(200,245,100,.35)}
    .fb-popup textarea::placeholder{color:var(--dim)}
    .fb-attach{display:flex;align-items:center;gap:8px}
    .fb-attach-btn{font-size:11px;color:var(--muted);background:var(--bg4);border:1px dashed var(--border);border-radius:6px;padding:6px 12px;cursor:pointer}
    #fbImgInput{display:none}
    .fb-att-prev{width:36px;height:36px;border-radius:5px;object-fit:cover;display:none}
    .fb-att-prev.show{display:block}
    .fb-popup-footer{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px}
    .btn-fb-cancel{flex:1;font-size:12px;padding:8px;border-radius:7px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer}
    .btn-fb-save{flex:1;font-size:12px;font-weight:600;padding:8px;border-radius:7px;background:var(--accent);color:#000;border:none;cursor:pointer}
    .btn-fb-save:hover{background:#d4ff6e}
    .feedback-panel{width:360px;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg2);overflow:hidden}
    .fp-header{padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
    .fp-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
    .fp-sub{font-size:11px;color:var(--dim)}
    .fp-list{flex:1;overflow-y:auto;padding:12px}
    .fp-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:100%;color:var(--dim);text-align:center;padding:24px}
    .fp-empty-icon{font-size:28px}
    .fp-empty-text{font-size:13px}
    .fp-empty-sub{font-size:11px;line-height:1.6}
    .fb-card{border:1px solid var(--border);border-radius:10px;background:var(--bg3);margin-bottom:8px;overflow:hidden}
    .fb-card-head{padding:10px 12px;display:flex;align-items:center;gap:8px;cursor:pointer}
    .fb-stag{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:4px;flex-shrink:0}
    .fb-stag.hero{background:rgba(124,109,250,.15);color:#a89dfc}
    .fb-stag.beneficios{background:rgba(6,214,160,.15);color:#06d6a0}
    .fb-stag.cta{background:rgba(200,245,100,.15);color:#9ac836}
    .fb-stag.depoimentos{background:rgba(255,209,102,.15);color:#ffd166}
    .fb-stag.formulario{background:rgba(92,157,255,.15);color:#5c9dff}
    .fb-stag.rodape{background:rgba(255,92,92,.15);color:#ff5c5c}
    .fb-stag.outro{background:rgba(255,255,255,.05);color:var(--muted)}
    .fb-card-title{font-size:12px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .fb-card-del{width:24px;height:24px;border-radius:5px;background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
    .fb-card-del:hover{background:var(--red-dim);color:var(--red)}
    .fb-card-body{padding:0 12px 12px;display:none}
    .fb-card.open .fb-card-body{display:block}
    .fb-card-text{font-size:12px;color:var(--muted);line-height:1.6}
    .version-bar{padding:8px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
    .version-label{font-size:11px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
    .version-btns{display:flex;gap:4px}
    .version-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);cursor:pointer}
    .version-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
    .fp-footer{padding:12px 14px;border-top:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;gap:8px}
    .fp-footer-count{font-size:11px;color:var(--dim);text-align:center}
    .btn-regen{width:100%;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#000;background:var(--accent);border:none;border-radius:9px;padding:12px;cursor:pointer}
    .btn-regen:hover{background:#d4ff6e}
    .btn-regen:disabled{opacity:.5;cursor:not-allowed}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:2px}
  </style>
</head>
<body>
<div class="topbar">
  <a class="topbar-logo" href="index.html"><span class="logo-dot"></span>Banco de Templates</a>
  <div class="topbar-sep"></div>
  <span class="project-name" id="projectName">Carregando...</span>
  <span class="status-badge revisao" id="statusBadge">Em revisão</span>
  <div class="topbar-actions">
    <button class="btn-top" onclick="toggleMode()" id="btnMode">✏️ Dar Feedback</button>
    <button class="btn-top danger" onclick="rejeitarLP()">✕ Rejeitar</button>
    <button class="btn-top primary" onclick="aprovarLP()">✓ Aprovar LP</button>
  </div>
</div>
<div class="workspace">
  <div class="preview-panel" id="previewPanel">
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeVisBtn" onclick="setMode('visualizar')">👁 Visualizar</button>
      <button class="mode-btn" id="modeFbBtn" onclick="setMode('feedback')">✏️ Feedback</button>
    </div>
    <div class="feedback-mode-hint" id="fbHint">Clique em qualquer seção da LP para adicionar feedback</div>
    <div class="lp-loading" id="lpLoading">
      <div class="lp-spinner"></div>
      <div class="lp-txt" id="lpTxt">Carregando LP...</div>
      <div class="lp-sub" id="lpSub"></div>
    </div>
    <div class="iframe-wrap" id="iframeWrap" style="display:none">
      <iframe id="lpIframe" title="Preview da LP" sandbox="allow-scripts allow-same-origin"></iframe>
      <div class="overlay-canvas" id="overlayCanvas" onclick="handleCanvasClick(event)"></div>
    </div>
    <div class="fb-popup" id="fbPopup">
      <div class="fb-popup-head">
        <span class="fb-popup-title" id="fbPopupTitle">Seção</span>
        <button class="fb-popup-close" onclick="closePopup()">×</button>
      </div>
      <div class="fb-popup-body">
        <select id="fbSectionSel">
          <option value="hero">🏠 Hero / Topo</option>
          <option value="beneficios">✅ Benefícios</option>
          <option value="como_funciona">⚙️ Como funciona</option>
          <option value="depoimentos">💬 Depoimentos</option>
          <option value="cta">🎯 CTA / Botões</option>
          <option value="formulario">📋 Formulário</option>
          <option value="rodape">🔻 Rodapé</option>
          <option value="outro">📌 Outro</option>
        </select>
        <textarea id="fbTextArea" rows="4" placeholder="O que precisa mudar nesta seção?"></textarea>
        <div class="fb-attach">
          <button type="button" class="fb-attach-btn" onclick="document.getElementById('fbImgInput').click()">📎 Imagem de referência</button>
          <input type="file" id="fbImgInput" accept="image/*" onchange="handleFbImg(this)" />
          <img id="fbAttPrev" class="fb-att-prev" />
        </div>
      </div>
      <div class="fb-popup-footer">
        <button class="btn-fb-cancel" onclick="closePopup()">Cancelar</button>
        <button class="btn-fb-save" onclick="saveFeedback()">Salvar feedback</button>
      </div>
    </div>
  </div>
  <div class="feedback-panel">
    <div class="fp-header">
      <div class="fp-title">Feedbacks</div>
      <div class="fp-sub" id="fpSub">Nenhum feedback adicionado</div>
    </div>
    <div class="version-bar">
      <span class="version-label">Versão</span>
      <div class="version-btns" id="versionBtns"><button class="version-btn active">v1</button></div>
    </div>
    <div class="fp-list" id="fpList">
      <div class="fp-empty" id="fpEmpty">
        <div class="fp-empty-icon">💬</div>
        <div class="fp-empty-text">Nenhum feedback ainda</div>
        <div class="fp-empty-sub">Ative "Dar Feedback" e clique em qualquer seção da LP</div>
      </div>
    </div>
    <div class="fp-footer">
      <div class="fp-footer-count" id="fpCount">0 feedbacks</div>
      <button class="btn-regen" id="btnRegen" onclick="regenerarLP()" disabled>Regenerar com feedbacks →</button>
    </div>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://oxzjpgotmysgdfqkucve.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94empwZ290bXlzZ2RmcWt1Y3ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNjMzMTIsImV4cCI6MjA5MjgzOTMxMn0.fV2PzQ6_r6mMUmx6T_rIXTggQ_sb64FU2FCDTSWYbbs';
const WEBHOOK_REGENERAR = 'https://workflow.v4arcos.com.br/webhook/regenerar-lp';
const WEBHOOK_APROVAR   = 'https://workflow.v4arcos.com.br/webhook/aprovar-lp';
const GITHUB_BASE = 'https://gustavo120405.github.io/banco-de-referencias/';

const params = new URLSearchParams(location.search);
const projetoId = params.get('id');
let currentMode = 'visualizar';
let feedbacks = [];
let fbImgBase64 = null;
let currentVersion = 1;
let totalVersions = 1;
let lpHtml = '';
let projeto = null;
let templatesData = [];

async function init() {
  if (!projetoId) { showLoading('Use ?id=ID_DO_PROJETO na URL', ''); return; }
  try {
    const r = await fetch(GITHUB_BASE + 'templates.json');
    templatesData = await r.json();
  } catch(e) {}
  await carregarProjeto();
}

async function carregarProjeto() {
  showLoading('Carregando projeto...', '');
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/projetos?id=eq.${projetoId}&select=*`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    const data = await res.json();
    if (!data || !data.length) { showLoading('Projeto não encontrado', 'ID: ' + projetoId); return; }
    projeto = data[0];
    document.getElementById('projectName').textContent = `${projeto.nome_empresa} — v${projeto.lp_versao_atual || 1}`;
    totalVersions = projeto.lp_versao_atual || 1;
    currentVersion = totalVersions;
    renderVersionBtns();
    await carregarLP(totalVersions);
  } catch(e) { showLoading('Erro: ' + e.message, ''); }
}

async function carregarLP(versao) {
  showLoading('Carregando LP...', '');
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/lps?projeto_id=eq.${projetoId}&versao=eq.${versao}&select=*`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    const data = await res.json();
    if (!data || !data.length) { showLoading('LP ainda não gerada', 'Recarregue em instantes'); return; }
    lpHtml = data[0].html_conteudo;
    renderLP(lpHtml);
    await carregarFeedbacks(versao);
  } catch(e) { showLoading('Erro: ' + e.message, ''); }
}

function renderLP(html) {
  const templateId = projeto ? (projeto.template_id || '') : '';
  const tpl = templatesData.find(t => t.id === templateId);
  const demoUrl = tpl ? tpl.demo_url : (projeto && projeto.template_url ? projeto.template_url : '');
  let baseDir = GITHUB_BASE;
  if (demoUrl) {
    const idx = demoUrl.lastIndexOf('/');
    baseDir = GITHUB_BASE + demoUrl.substring(0, idx + 1);
  }
  let h = html || '';
  if (!h.toLowerCase().includes('<!doctype')) h = '<!DOCTYPE html>\n' + h;
  if (h.toLowerCase().includes('<head>')) {
    h = h.replace(/<head>/i, `<head><base href="${baseDir}">`);
  } else {
    h = `<!DOCTYPE html><html><head><base href="${baseDir}"></head><body>${h}</body></html>`;
  }
  const iframe = document.getElementById('lpIframe');
  document.getElementById('lpLoading').classList.add('hidden');
  document.getElementById('iframeWrap').style.display = 'block';
  iframe.srcdoc = h;
}

async function carregarFeedbacks(versao) {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/feedbacks?projeto_id=eq.${projetoId}&versao=eq.${versao}&tipo=eq.lp&select=*&order=created_at.asc`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    feedbacks = await res.json() || [];
    renderFeedbackList();
  } catch(e) {}
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('modeVisBtn').classList.toggle('active', mode === 'visualizar');
  document.getElementById('modeFbBtn').classList.toggle('active', mode === 'feedback');
  const canvas = document.getElementById('overlayCanvas');
  const hint = document.getElementById('fbHint');
  if (mode === 'feedback') { canvas.classList.add('active'); hint.classList.add('show'); setupOverlay(); }
  else { canvas.classList.remove('active'); hint.classList.remove('show'); closePopup(); }
}
function toggleMode() {
  setMode(currentMode === 'visualizar' ? 'feedback' : 'visualizar');
  document.getElementById('btnMode').textContent = currentMode === 'feedback' ? '👁 Visualizar' : '✏️ Dar Feedback';
}

function setupOverlay() {
  const canvas = document.getElementById('overlayCanvas');
  canvas.innerHTML = '';
  const secs = [
    {id:'hero',label:'Hero / Topo',top:'0%',h:'28%'},
    {id:'beneficios',label:'Benefícios',top:'28%',h:'18%'},
    {id:'como_funciona',label:'Como funciona',top:'46%',h:'15%'},
    {id:'depoimentos',label:'Depoimentos',top:'61%',h:'15%'},
    {id:'cta',label:'CTA',top:'76%',h:'12%'},
    {id:'rodape',label:'Rodapé',top:'88%',h:'12%'},
  ];
  secs.forEach(s => {
    const d = document.createElement('div');
    d.className = 'section-highlight';
    d.style.cssText = `top:${s.top};left:0;width:100%;height:${s.h}`;
    if (feedbacks.some(f => f.secao === s.id)) d.classList.add('has-feedback');
    d.innerHTML = `<span class="section-label">${s.label}</span>`;
    d.addEventListener('click', e => { e.stopPropagation(); openPopup(s.id, s.label, e); });
    canvas.appendChild(d);
  });
}

let curSection = null;
function openPopup(sid, label, event) {
  curSection = sid;
  fbImgBase64 = null;
  document.getElementById('fbAttPrev').classList.remove('show');
  document.getElementById('fbTextArea').value = '';
  document.getElementById('fbSectionSel').value = sid;
  document.getElementById('fbPopupTitle').textContent = `Seção: ${label}`;
  const popup = document.getElementById('fbPopup');
  popup.classList.add('show');
  const rect = document.getElementById('previewPanel').getBoundingClientRect();
  let top = event.clientY - rect.top - 20;
  let left = event.clientX - rect.left + 20;
  if (left + 320 > rect.width) left = event.clientX - rect.left - 340;
  if (top + 340 > rect.height) top = event.clientY - rect.top - 340;
  popup.style.top = Math.max(60, top) + 'px';
  popup.style.left = Math.max(10, left) + 'px';
}
function closePopup() { document.getElementById('fbPopup').classList.remove('show'); curSection = null; }
function handleFbImg(input) {
  const file = input.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    fbImgBase64 = { name: file.name, type: file.type, data: e.target.result.split(',')[1] };
    const img = document.getElementById('fbAttPrev'); img.src = e.target.result; img.classList.add('show');
  };
  r.readAsDataURL(file);
}
function handleCanvasClick(e) { if (e.target === document.getElementById('overlayCanvas')) closePopup(); }

async function saveFeedback() {
  const texto = document.getElementById('fbTextArea').value.trim();
  if (!texto) return;
  const secao = document.getElementById('fbSectionSel').value;
  const fb = { projeto_id: projetoId, tipo: 'lp', referencia_id: projetoId, versao: currentVersion, account: projeto?.account_responsavel || 'account', secao, descricao: texto, acao_solicitada: 'ajustar', imagem_anexo: fbImgBase64 || null };
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/feedbacks`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=representation' },
      body: JSON.stringify(fb)
    });
    if (res.ok) { const saved = await res.json(); feedbacks.push(saved[0]||fb); renderFeedbackList(); closePopup(); setupOverlay(); }
  } catch(e) {}
}

const SC = { hero:'hero', beneficios:'beneficios', cta:'cta', depoimentos:'depoimentos', formulario:'formulario', rodape:'rodape', outro:'outro', como_funciona:'beneficios' };
const SN = { hero:'Hero', beneficios:'Benefícios', cta:'CTA', depoimentos:'Depoimentos', formulario:'Formulário', rodape:'Rodapé', outro:'Outro', como_funciona:'Como funciona' };

function renderFeedbackList() {
  const list = document.getElementById('fpList');
  const empty = document.getElementById('fpEmpty');
  document.getElementById('fpCount').textContent = `${feedbacks.length} feedback${feedbacks.length!==1?'s':''}`;
  document.getElementById('fpSub').textContent = feedbacks.length ? `${feedbacks.length} ponto${feedbacks.length!==1?'s':''} para revisar` : 'Nenhum feedback adicionado';
  document.getElementById('btnRegen').disabled = feedbacks.length === 0;
  if (!feedbacks.length) { empty.style.display = 'flex'; return; }
  empty.style.display = 'none';
  list.querySelectorAll('.fb-card').forEach(c => c.remove());
  feedbacks.forEach((fb, i) => {
    const card = document.createElement('div');
    card.className = 'fb-card';
    card.innerHTML = `<div class="fb-card-head" onclick="this.closest('.fb-card').classList.toggle('open')"><span class="fb-stag ${SC[fb.secao]||'outro'}">${SN[fb.secao]||fb.secao}</span><span class="fb-card-title">${fb.descricao.slice(0,50)}${fb.descricao.length>50?'...':''}</span><button class="fb-card-del" onclick="delFb(event,'${fb.id||''}',${i})">×</button></div><div class="fb-card-body"><p class="fb-card-text">${fb.descricao}</p></div>`;
    list.appendChild(card);
  });
}

async function delFb(e, id, idx) {
  e.stopPropagation();
  if (id) await fetch(`${SUPABASE_URL}/rest/v1/feedbacks?id=eq.${id}`, { method:'DELETE', headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } }).catch(()=>{});
  feedbacks.splice(idx, 1);
  renderFeedbackList(); setupOverlay();
}

async function regenerarLP() {
  if (!feedbacks.length) return;
  const btn = document.getElementById('btnRegen');
  btn.disabled = true; btn.textContent = 'Regenerando...';
  try {
    const res = await fetch(WEBHOOK_REGENERAR, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ projeto_id: projetoId, versao_atual: currentVersion, feedbacks }) });
    if (res.ok) { alert('LP sendo regenerada! Recarregue em alguns segundos.'); window.location.reload(); }
  } catch(e) { alert('Erro ao regenerar.'); }
  finally { btn.disabled = false; btn.textContent = 'Regenerar com feedbacks →'; }
}

async function aprovarLP() {
  if (!confirm('Confirma aprovação?')) return;
  try { await fetch(WEBHOOK_APROVAR, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ projeto_id: projetoId, versao: currentVersion, acao:'aprovar' }) }); } catch(e) {}
  document.getElementById('statusBadge').textContent = 'Aprovada ✓';
  document.getElementById('statusBadge').className = 'status-badge aprovada';
  alert('LP aprovada!');
}
async function rejeitarLP() { if (!confirm('Rejeitar e regenerar?')) return; document.getElementById('btnRegen').click(); }

function renderVersionBtns() {
  const wrap = document.getElementById('versionBtns');
  wrap.innerHTML = '';
  for (let i = 1; i <= totalVersions; i++) {
    const btn = document.createElement('button');
    btn.className = `version-btn ${i === currentVersion ? 'active' : ''}`;
    btn.textContent = `v${i}`;
    btn.onclick = () => { currentVersion = i; renderVersionBtns(); carregarLP(i); };
    wrap.appendChild(btn);
  }
}

function showLoading(txt, sub) {
  document.getElementById('lpLoading').classList.remove('hidden');
  document.getElementById('iframeWrap').style.display = 'none';
  document.getElementById('lpTxt').textContent = txt;
  document.getElementById('lpSub').textContent = sub;
}

init();
</script>
</body>
</html>
